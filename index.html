<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velocity3D — Lisbon</title></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div class="pill"><b id="carName">Ferrari SF90 Stradale</b><small>Velocity3D • Lisbon Open World</small></div><button id="settings">Settings</button></div><div class="controls">WASD drive • SPACE handbrake • R reset • C camera • ESC settings</div><div class="speed"><b id="speed">0</b><span>KM/H</span></div></div>
<div id="panel"><div class="box"><h1>Velocity3D</h1><p>Lisbon Open World</p><div id="cars"></div><div class="actions"><button id="resume">Resume</button><button id="reset">Reset Car</button><button id="camera">Change Camera</button><button id="reload">Reload City</button></div></div></div>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bb7d9;font-family:Inter,Arial,sans-serif}#game{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:start}.pill,.controls{background:rgba(12,15,18,.72);backdrop-filter:blur(12px);border:1px solid #ffffff30;border-radius:15px;padding:11px 15px}.pill small{display:block;opacity:.7;margin-top:3px}.top button,.actions button,.carCard{pointer-events:auto;border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.top button{background:#fff;color:#111}.controls{position:absolute;bottom:18px;left:18px;font-size:12px}.speed{position:absolute;right:22px;bottom:16px;text-align:right}.speed b{font-size:56px;display:block;line-height:.9}.speed span{font-size:11px;opacity:.75}#panel{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;background:#0008}.box{width:min(850px,92vw);max-height:90vh;overflow:auto;background:#f4f4f4;color:#111;border-radius:24px;padding:25px}.box h1{margin:0}.box p{margin-top:4px;color:#666}.carCard{display:block;width:100%;margin:6px 0;text-align:left;background:#ddd}.carCard small{display:block;color:#666;margin-top:3px}.carCard.active{outline:3px solid #1677ff;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{background:#111;color:#fff}
</style>
<script type="module" src="/src/main.js"></script>
</body></html>
