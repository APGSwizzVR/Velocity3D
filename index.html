<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velocity 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86b8dc;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
.pill{pointer-events:auto;background:#111b;padding:10px 14px;border:1px solid #ffffff55;border-radius:12px;backdrop-filter:blur(8px)}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;color:#111;font-weight:700}
.controls{position:absolute;left:16px;bottom:16px;background:#111b;padding:10px 14px;border-radius:12px;font-size:12px}
.speed{position:absolute;right:18px;bottom:14px;text-align:right}.speed b{font-size:54px}
#panel{display:none;position:fixed;inset:0;background:#0009;z-index:5;place-items:center}
.box{background:#f4f4f4;color:#111;width:min(700px,90vw);max-height:80vh;overflow:auto;border-radius:20px;padding:22px}
.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.car{padding:14px;text-align:left;background:#ddd;border:2px solid transparent}.car.active{border-color:#1677ff}
@media(max-width:600px){.cars{grid-template-columns:1fr}.speed b{font-size:40px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top"><div class="pill"><b id="carName">Ferrari SF90 Stradale</b><br><small>Velocity 3D • Test Circuit</small></div><button id="settings">Settings</button></div>
 <div class="controls">W / S — throttle & brake &nbsp; A / D — steer &nbsp; R — reset &nbsp; ESC — settings</div>
 <div class="speed"><b id="speed">0</b><br>KM/H</div>
</div>
<div id="panel"><div class="box"><h2>Settings</h2><p>Select car</p><div class="cars" id="cars"></div><br><button id="resume">Resume</button> <button id="reset">Reset Car</button></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.body.innerHTML='<h2 style="padding:30px">WebGL is not available in this browser.</h2>';return}
const cars=[
['Ferrari SF90 Stradale','#e63946',340],['Lamborghini Revuelto','#f2c94c',350],
['Porsche 911 GT3 RS','#f4f4f4',296],['McLaren 750S','#ff8700',332],
['Nissan GT-R Nismo','#e52b2b',330],['Toyota GR Supra','#ffd23f',250]
];
let selected=0,keys={},paused=false,last=performance.now(),speed=0,steer=0;
let px=0,pz=70,rot=0;
const objects=[];
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const vs=shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec3 c;uniform mat4 mvp;varying vec3 v;void main(){gl_Position=mvp*vec4(p,1.);v=c;}');
const fs=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.);}');
const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
const ap=gl.getAttribLocation(prog,'p'),ac=gl.getAttribLocation(prog,'c'),um=gl.getUniformLocation(prog,'mvp');
const V=[],C=[];
function quad(a,b,c,d,col){[a,b,c,a,c,d].forEach(q=>{V.push(...q);C.push(...col)})}
function cube(x,y,z,w,h,d,col){
 const x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],col);
 quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],col);
 quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],col);
 quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],col);
 quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],col);
}
function roadSegment(z,len){
 const w=18; quad([-w,0,z],[w,0,z],[w,0,z+len],[-w,0,z+len],[.10,.11,.13]);
}
function line(x,z,w=0.25,d=5){quad([x,.025,z],[x+w,.025,z],[x+w,.025,z+d],[x,.025,z+d],[.92,.92,.92])}
function tree(x,z,s=1){
 cube(x,0,z,1.4*s,2.5*s,1.4*s,[.30,.18,.08]);
 cube(x,2.3*s,z,4*s,4*s,4*s,[.08,.38,.12]);
}
function buildWorld(){
 quad([-180,-.1,-180],[180,-.1,-180],[180,-.1,180],[-180,-.1,180],[.20,.48,.18]);
 for(let z=-150;z<150;z+=12){roadSegment(z,12);line(-9,z+3,.25,5);line(8.75,z+3,.25,5)}
 for(let z=-150;z<150;z+=10){cube(-19,0,z,1,1.2,10,[.75,.75,.75]);cube(19,0,z,1,1.2,10,[.75,.75,.75])}
 for(let z=-150;z<150;z+=18){tree(-30,z,1);tree(30,z+7,1.15)}
 for(let z=-145;z<145;z+=30){cube(-42,0,z,10,5,12,[.38,.40,.44]);cube(42,0,z+12,10,5,12,[.38,.40,.44])}
 // start/finish
 for(let i=-8;i<8;i+=2)quad([i,.03,62],[i+1,.03,62],[i+1,.03,67],[i,.03,67],(i/2%2)?[.95,.95,.95]:[.05,.05,.05]);
 // distant hills
 for(let x=-160;x<=160;x+=20)cube(x,0,-175,18,25+(Math.abs(x)%30),25,[.24,.34,.38]);
}
buildWorld();
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([...V,...C]),gl.STATIC_DRAW);
const vcount=V.length/3;
const carV=[],carC=[];
function carPart(x,y,z,w,h,d,col){const start=carV.length;const oldV=V.splice(0,0); // no-op to keep helper independent
 const x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1]].forEach(q=>carV.push(...q));
 [[0,1,2,0,2,3],[4,5,6,4,6,7],[0,4,7,0,7,3],[1,5,6,1,6,2],[3,2,6,3,6,7],[0,1,5,0,5,4]].forEach(f=>f.forEach(i=>carC.push(...col)));
 return start;
}
function buildCar(){
 const base=carV.length/3; carPart(0,.55,0,3.8,.8,7,cars[selected][1].match(/../g)?[parseInt(cars[selected][1].slice(1,3),16)/255,parseInt(cars[selected][1].slice(3,5),16)/255,parseInt(cars[selected][1].slice(5,7),16)/255]:[.8,.1,.1]);
 carPart(0,1.35,-.2,2.6,.7,3,[.05,.08,.11]); carPart(-1.85,.3,0,.45,.45,1,[.03,.03,.03]);carPart(1.85,.3,0,.45,.45,1,[.03,.03,.03]);
}
let carBuf=gl.createBuffer();
function rebuildCar(){carV.length=0;carC.length=0;buildCar();gl.bindBuffer(gl.ARRAY_BUFFER,carBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([...carV,...carC]),gl.DYNAMIC_DRAW)}
rebuildCar();
function matMul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[r*4+c]=a[r*4]*b[c]+a[r*4+1]*b[c+4]+a[r*4+2]*b[c+8]+a[r*4+3]*b[c+12];return o}
function persp(fov,asp,n,f){const q=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=q/asp;o[5]=q;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function look(eye,center,up){let zx=eye[0]-center[0],zy=eye[1]-center[1],zz=eye[2]-center[2],zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx,xl=Math.hypot(xx,xy,xz);xx/=xl;xy/=xl;xz/=xl;let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*eye[0]+xy*eye[1]+xz*eye[2]),-(yx*eye[0]+yy*eye[1]+yz*eye[2]),-(zx*eye[0]+zy*eye[1]+zz*eye[2]),1])}
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();
function draw(){
 gl.enable(gl.DEPTH_TEST);gl.clearColor(.38,.62,.78,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);
 const fx=Math.sin(rot),fz=Math.cos(rot),eye=[px-fx*12,6,pz-fz*12],center=[px+fx*10,1,pz+fz*10];
 const mvp=matMul(persp(1.05,canvas.width/canvas.height,.1,600),look(eye,center,[0,1,0]));
 gl.uniformMatrix4fv(um,false,mvp);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,V.length*4);gl.drawArrays(gl.TRIANGLES,0,vcount);
 // car as separate model translated/rotated on CPU
 const cv=[];for(let i=0;i<carV.length/3;i++){let x=carV[i*3],y=carV[i*3+1],z=carV[i*3+2],cs=Math.cos(rot),sn=Math.sin(rot);cv.push(x*cs-z*sn+px,y,z*cs+x*sn+pz)}
 gl.bindBuffer(gl.ARRAY_BUFFER,carBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,new Float32Array(cv));gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,carV.length*4);gl.drawArrays(gl.TRIANGLES,0,carV.length/3);
}
function update(dt){
 if(paused)return;
 const max=cars[selected][2]/3.6;
 if(keys.w||keys.ArrowUp)speed+=42*dt;
 if(keys.s||keys.ArrowDown)speed-=75*dt;
 speed*=Math.pow(.985,dt*60);speed=Math.max(-18,Math.min(max,speed));
 const steerInput=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);
 steer+=((steerInput*.9)-steer)*Math.min(1,dt*8);
 rot+=steer*(.55+Math.min(Math.abs(speed)/max,.8))*dt*(speed>=0?1:-1);
 const nx=px+Math.sin(rot)*speed*dt,nz=pz+Math.cos(rot)*speed*dt;
 if(Math.abs(nx)<17.5&&nz>-170&&nz<170){px=nx;pz=nz}else speed*=.25;
 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);
 draw();
}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function reset(){px=0;pz=70;rot=0;speed=0}
function open(){paused=true;document.getElementById('panel').style.display='grid'}
function close(){paused=false;document.getElementById('panel').style.display='none'}
document.getElementById('settings').onclick=open;document.getElementById('resume').onclick=close;document.getElementById('reset').onclick=()=>{reset();close()};
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset();if(e.key==='Escape')(paused?close:open)()});
addEventListener('keyup',e=>keys[e.key]=false);
const carsEl=document.getElementById('cars');
cars.forEach((c,i)=>{const b=document.createElement('button');b.className='car'+(i===0?' active':'');b.innerHTML='<b>'+c[0]+'</b><br><small>'+c[2]+' km/h</small>';b.onclick=()=>{selected=i;document.getElementById('carName').textContent=c[0];document.querySelectorAll('.car').forEach(x=>x.classList.remove('active'));b.classList.add('active');rebuildCar();reset()};carsEl.appendChild(b)});
})();
</script>
</body>
</html>
