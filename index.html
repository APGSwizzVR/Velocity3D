<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velocity 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9d1;font-family:Arial}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:auto}.pill{background:#111c;border:1px solid #fff4;border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px}.controls{position:absolute;left:16px;bottom:16px;font-size:12px}.speed{position:absolute;right:20px;bottom:15px;text-align:right}.speed b{font-size:58px}.panel{display:none;position:fixed;inset:0;background:#0008;place-items:center;z-index:5;pointer-events:auto}.box{background:#f5f5f7;color:#111;border-radius:20px;padding:24px;width:min(500px,88vw);box-shadow:0 20px 80px #000}.box button{margin:5px}.primary{background:#1677ff;color:white}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="pill"><b id="carName">Ferrari SF90 Stradale</b><br><small>Basic Test Map</small></div><button class="pill" id="settings">Settings</button></div><div class="controls pill">W/S = throttle & brake · A/D = steer · R = reset · ESC = settings</div><div class="speed"><b id="speed">0</b><small> KM/H</small></div></div><div id="panel" class="panel"><div class="box"><h2>Settings</h2><p>Car</p><div id="cars"></div><p>Map: Basic Test Circuit</p><button class="primary" id="resume">Resume</button><button id="reset">Reset Car</button></div></div><script>(function(){'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),D=devicePixelRatio||1;let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const cars=[['Ferrari SF90 Stradale','#e63946',340],['Lamborghini Revuelto','#f2c94c',350],['Porsche 911 GT3 RS','#fff',296],['McLaren 750S','#ff8700',332],['Nissan GT-R Nismo','#ef233c',330],['Toyota GR Supra','#ffb703',250]];let selected=0,x=0,z=-112,angle=0,speed=0,paused=false;const keys={};const panel=document.getElementById('panel');function reset(){x=0;z=-112;angle=0;speed=0}function blocked(nx,nz){return Math.abs(nx)>128||Math.abs(nz)>138||Math.abs(nx)<96&&Math.abs(nz)<96}function update(dt){if(paused)return;if(keys.w||keys.ArrowUp)speed+=38*dt;if(keys.s||keys.ArrowDown)speed-=70*dt;speed*=Math.pow(.985,dt*60);speed=Math.max(-25,Math.min(cars[selected][2]/3.6,speed));let steer=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);angle-=steer*1.9*dt*(.35+Math.min(Math.abs(speed)/35,1));let nx=x+Math.sin(angle)*speed*dt,nz=z+Math.cos(angle)*speed*dt;if(!blocked(nx,nz)){x=nx;z=nz}else speed=0;document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6)}function project(wx,wz){let dx=wx-x,dz=wz-z,ca=Math.cos(-angle),sa=Math.sin(-angle),cx=dx*ca-dz*sa,cz=dx*sa+dz*ca;if(cz<2)return null;let f=Math.min(W,H)*.9,scale=f/cz;return [W/2+cx*scale,H*.57-scale*3,scale]}function quad(a,b,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(b[0],H);ctx.lineTo(a[0],H);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#5f9bc9');sky.addColorStop(1,'#c8e4ef');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.6);ctx.fillStyle='#4d8245';ctx.fillRect(0,H*.55,W,H*.45);const roadW=115;for(let i=1;i<18;i++){let zz=z+i*12;let p1=project(-roadW,zz),p2=project(roadW,zz),p3=project(-roadW,zz+12),p4=project(roadW,zz+12);if(p1&&p2&&p3&&p4){ctx.fillStyle='#30343a';ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p4[0],p4[1]);ctx.lineTo(p3[0],p3[1]);ctx.fill();ctx.strokeStyle='#fff';ctx.setLineDash([10,12]);ctx.beginPath();ctx.moveTo((p1[0]+p2[0])/2,p1[1]);ctx.lineTo((p3[0]+p4[0])/2,p3[1]);ctx.stroke();ctx.setLineDash([])}}for(let i=0;i<24;i++){let zz=z+20+i*14,p=project(i%2?-98:98,zz);if(p){ctx.fillStyle='#1d5b32';ctx.beginPath();ctx.arc(p[0],p[1],Math.max(2,p[2]*7),0,Math.PI*2);ctx.fill()}}let carY=H*.72;ctx.save();ctx.translate(W/2,carY);ctx.rotate(-angle*.22);ctx.fillStyle=cars[selected][1];ctx.fillRect(-38,-72,76,130);ctx.fillStyle='#18222b';ctx.fillRect(-27,-50,54,42);ctx.fillStyle='#111';for(const wx of[-43,43])for(const wy of[-48,48])ctx.fillRect(wx-8,wy-14,16,28);ctx.restore()}function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}function open(){paused=true;panel.style.display='grid'}function close(){paused=false;panel.style.display='none'}document.getElementById('settings').onclick=open;document.getElementById('resume').onclick=close;document.getElementById('reset').onclick=reset;document.getElementById('cars').innerHTML=cars.map((v,i)=>'<button data-i="'+i+'">'+v[0]+'</button>').join('');document.querySelectorAll('#cars button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;document.getElementById('carName').textContent=cars[selected][0];reset()});addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset();if(e.key==='Escape')panel.style.display==='grid'?close():open()});addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('carName').textContent=cars[0][0];requestAnimationFrame(loop)})()</script></body></html>
