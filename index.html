<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velocity 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86b8dc;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
.pill{pointer-events:auto;background:#111b;padding:10px 14px;border:1px solid #ffffff55;border-radius:12px;backdrop-filter:blur(8px)}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;color:#111;font-weight:700}
.controls{position:absolute;left:16px;bottom:16px;background:#111b;padding:10px 14px;border-radius:12px;font-size:12px}
.speed{position:absolute;right:18px;bottom:14px;text-align:right}.speed b{font-size:54px}
#panel{display:none;position:fixed;inset:0;background:#0009;z-index:5;place-items:center}
.box{background:#f4f4f4;color:#111;width:min(700px,90vw);max-height:80vh;overflow:auto;border-radius:20px;padding:22px}
.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.car{padding:14px;text-align:left;background:#ddd;border:2px solid transparent}.car.active{border-color:#1677ff}
@media(max-width:600px){.cars{grid-template-columns:1fr}.speed b{font-size:40px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="top"><div class="pill"><b id="carName">Ferrari SF90 Stradale</b><br><small>Velocity 3D • Test Circuit</small></div><button id="settings">Settings</button></div>
<div class="controls">W / S — throttle & brake &nbsp; A / D — steer &nbsp; R — reset &nbsp; ESC — settings</div>
<div class="speed"><b id="speed">0</b><br>KM/H</div>
</div>
<div id="panel"><div class="box"><h2>Settings</h2><p>Select car</p><div class="cars" id="cars"></div><br><button id="resume">Resume</button> <button id="reset">Reset Car</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.body.innerHTML='<h2 style="padding:30px">WebGL is not available in this browser.</h2>';return}
const cars=[
['Ferrari SF90 Stradale','#e63946',340],['Lamborghini Revuelto','#f2c94c',350],
['Porsche 911 GT3 RS','#f4f4f4',296],['McLaren 750S','#ff8700',332],
['Nissan GT-R Nismo','#e52b2b',330],['Toyota GR Supra','#ffd23f',250]
];
let selected=0,keys={},paused=false,last=performance.now(),speed=0,steer=0,px=0,pz=70,rot=0;
let throttle=0,brake=0,velocity=0,steerAngle=0;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const vs=shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec3 c;uniform mat4 mvp;varying vec3 v;void main(){gl_Position=mvp*vec4(p,1.0);v=c;}');
const fs=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.0);}');
const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
const ap=gl.getAttribLocation(prog,'p'),ac=gl.getAttribLocation(prog,'c'),um=gl.getUniformLocation(prog,'mvp');
const V=[],C=[];
function quad(a,b,c,d,col){[a,b,c,a,c,d].forEach(q=>{V.push(...q);C.push(...col)})}
function cube(x,y,z,w,h,d,col){
 const x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],col);
 quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],col);
 quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],col);
 quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],col);
 quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],col);
}
function road(z,len){quad([-18,0,z],[18,0,z],[18,0,z+len],[-18,0,z+len],[.10,.11,.13])}
function line(x,z,w=.25,d=5){quad([x,.025,z],[x+w,.025,z],[x+w,.025,z+d],[x,.025,z+d],[.92,.92,.92])}
function tree(x,z,s=1){cube(x,0,z,1.4*s,2.5*s,1.4*s,[.30,.18,.08]);cube(x,2.3*s,z,4*s,4*s,4*s,[.08,.38,.12])}
function world(){
 quad([-180,-.1,-180],[180,-.1,-180],[180,-.1,180],[-180,-.1,180],[.20,.48,.18]);
 for(let z=-150;z<150;z+=12){road(z,12);line(-9,z+3);line(8.75,z+3)}
 for(let z=-150;z<150;z+=10){cube(-19,0,z,1,1.2,10,[.75,.75,.75]);cube(19,0,z,1,1.2,10,[.75,.75,.75])}
 for(let z=-150;z<150;z+=18){tree(-30,z);tree(30,z+7,1.15)}
 for(let z=-145;z<145;z+=30){cube(-42,0,z,10,5,12,[.38,.40,.44]);cube(42,0,z+12,10,5,12,[.38,.40,.44])}
 for(let i=-8;i<8;i+=2)quad([i,.03,62],[i+1,.03,62],[i+1,.03,67],[i,.03,67],(i/2%2)?[.95,.95,.95]:[.05,.05,.05]);
 for(let x=-160;x<=160;x+=20)cube(x,0,-175,18,25+(Math.abs(x)%30),25,[.24,.34,.38]);
}
world();
const worldBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,worldBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([...V,...C]),gl.STATIC_DRAW);const worldCount=V.length/3;
let carV=[],carC=[],carBuf=gl.createBuffer();
function quadCar(a,b,c,d,col){[a,b,c,a,c,d].forEach(q=>{carV.push(...q);carC.push(...col)})}
function addCarCube(x,y,z,w,h,d,col){
 const x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 const f=[[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],[[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1]],[[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]],[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]];
 f.forEach(q=>quadCar(q[0],q[1],q[2],q[3],col));
}
function addWheel(x,z){
 addCarCube(x,.30,z,.48,.48,1.35,[.025,.025,.025]);
}
function rebuildCar(){
 carV=[];carC=[];
 const h=cars[selected][1],body=[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
 addCarCube(0,.48,.1,3.65,.68,7.0,body);
 addCarCube(0,1.05,-.35,2.65,.62,3.35,[.035,.045,.06]);
 addCarCube(0,1.12,1.15,2.35,.18,1.1,body);
 addCarCube(0,.78,3.15,2.9,.14,.55,body);
 addWheel(-1.86,-1.95);addWheel(1.86,-1.95);addWheel(-1.86,1.95);addWheel(1.86,1.95);
 addCarCube(-1.55,.72,-3.18,.7,.22,.16,[.8,.08,.04]);addCarCube(1.55,.72,-3.18,.7,.22,.16,[.8,.08,.04]);
 addCarCube(-1.35,.86,3.18,.55,.18,.12,[1,.85,.55]);addCarCube(1.35,.86,3.18,.55,.18,.12,[1,.85,.55]);
 gl.bindBuffer(gl.ARRAY_BUFFER,carBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([...carV,...carC]),gl.STATIC_DRAW);
}
rebuildCar();
function perspective(fov,aspect,near,far){const f=1/Math.tan(fov/2),nf=1/(near-far),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)*nf;o[11]=-1;o[14]=2*far*near*nf;return o}
function lookAt(eye,target){
 let zx=eye[0]-target[0],zy=eye[1]-target[1],zz=eye[2]-target[2],zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;
 let xx=zz,xy=0,xz=-zx,xl=Math.hypot(xx,xz);xx/=xl;xz/=xl;
 const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
 o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=yy;o[6]=zy;o[8]=xz;o[9]=yz;o[10]=zz;o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);o[15]=1;return o
}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();
function draw(){
 gl.enable(gl.DEPTH_TEST);gl.clearColor(.38,.62,.78,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);
 const fx=Math.sin(rot),fz=Math.cos(rot),eye=[px-fx*13,5.5,pz-fz*13],target=[px+fx*12,1,pz+fz*12];
 gl.uniformMatrix4fv(um,false,mul(perspective(1.05,canvas.width/canvas.height,.1,600),lookAt(eye,target)));
 gl.bindBuffer(gl.ARRAY_BUFFER,worldBuf);gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,V.length*4);gl.drawArrays(gl.TRIANGLES,0,worldCount);
 const cv=new Float32Array(carV.length),cs=Math.cos(rot),sn=Math.sin(rot);
 for(let i=0;i<carV.length/3;i++){const x=carV[i*3],y=carV[i*3+1],z=carV[i*3+2];cv[i*3]=x*cs-z*sn+px;cv[i*3+1]=y;cv[i*3+2]=z*cs+x*sn+pz}
 gl.bindBuffer(gl.ARRAY_BUFFER,carBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,cv);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,carV.length*4);gl.drawArrays(gl.TRIANGLES,0,carV.length/3);
}
function reset(){px=0;pz=70;rot=0;speed=0;velocity=0;steer=0;steerAngle=0}
function update(dt){
 if(paused)return;
 const max=cars[selected][2]/3.6;
 const forward=keys.w||keys.ArrowUp,reverse=keys.s||keys.ArrowDown;
 throttle += ((forward?1:0)-throttle)*Math.min(1,dt*6);
 brake += ((reverse?1:0)-brake)*Math.min(1,dt*10);
 if(forward) velocity += (max*.72)*dt;
 else if(reverse && velocity>1) velocity -= 34*dt;
 else velocity *= Math.pow(.992,dt*60);
 if(!forward&&!reverse) velocity *= Math.pow(.996,dt*60);
 if(reverse&&velocity<=1) velocity -= 24*dt;
 velocity=Math.max(-24,Math.min(max,velocity));
 const steerInput=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);
 const steerLimit=Math.max(.28,1-Math.abs(velocity)/max*.42);
 const targetSteer=steerInput*steerLimit;
 steer += (targetSteer-steer)*Math.min(1,dt*7);
 const speedFactor=Math.min(1,Math.abs(velocity)/12);
 const wheelAngle=steer*(.55+.45*speedFactor);
 steerAngle += (wheelAngle-steerAngle)*Math.min(1,dt*10);
 rot += steerAngle*(0.42+Math.min(Math.abs(velocity)/max,.9)*.35)*dt*(velocity>=0?1:-1);
 const nx=px+Math.sin(rot)*velocity*dt,nz=pz+Math.cos(rot)*velocity*dt;
 if(Math.abs(nx)<17.15&&nz>-170&&nz<170){px=nx;pz=nz}else{velocity*=.35;steer*=.5}
 speed=velocity;
 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);
 draw();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function open(){paused=true;document.getElementById('panel').style.display='grid'}function close(){paused=false;document.getElementById('panel').style.display='none'}
document.getElementById('settings').onclick=open;document.getElementById('resume').onclick=close;document.getElementById('reset').onclick=()=>{reset();close()};
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset();if(e.key==='Escape')(paused?close:open)()});
addEventListener('keyup',e=>keys[e.key]=false);
const carsEl=document.getElementById('cars');
cars.forEach((c,i)=>{const b=document.createElement('button');b.className='car'+(i===0?' active':'');b.innerHTML='<b>'+c[0]+'</b><br><small>'+c[2]+' km/h</small>';b.onclick=()=>{selected=i;document.getElementById('carName').textContent=c[0];document.querySelectorAll('.car').forEach(x=>x.classList.remove('active'));b.classList.add('active');rebuildCar();reset()};carsEl.appendChild(b)});
})();
</script>
</body>
</html>
